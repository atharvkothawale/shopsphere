{% extends "base.html" %}

{% block title %}Sign In | {{ app_name }}{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
    <div class="auth-card" id="login-card">
        <div class="auth-header">
            <div class="auth-icon-badge">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                    <polyline points="10 17 15 12 10 7"></polyline>
                    <line x1="15" y1="12" x2="3" y2="12"></line>
                </svg>
            </div>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to your {{ app_name }} account to track orders and checkout faster</p>
        </div>

        <form action="{{ url_for('auth.login', next=request.args.get('next', '')) }}" method="POST" class="auth-form" id="login-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="login-email" class="form-label">Email Address <span class="required-star">*</span></label>
                <div class="input-icon-wrapper">
                    <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    <input 
                        type="email" 
                        id="login-email" 
                        name="email" 
                        class="form-control with-icon" 
                        placeholder="you@example.com" 
                        value="{{ email or '' }}" 
                        required 
                        autocomplete="email" 
                        autofocus
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="login-password" class="form-label">Password <span class="required-star">*</span></label>
                <div class="input-icon-wrapper">
                    <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input 
                        type="password" 
                        id="login-password" 
                        name="password" 
                        class="form-control with-icon with-toggle" 
                        placeholder="Enter your password" 
                        required 
                        autocomplete="current-password"
                    >
                    <button type="button" class="password-toggle-btn" id="toggle-login-password" aria-label="Toggle password visibility">
                        <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-submit-group">
                <button type="submit" class="btn-auth-submit" id="btn-login-submit">
                    <span class="btn-text">Sign In</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </div>
        </form>

        <div class="auth-footer-links">
            <span>Don't have an account?</span>
            <a href="{{ url_for('auth.register') }}" class="auth-link-highlight" id="link-goto-register">Create an account</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const toggleBtn = document.getElementById('toggle-login-password');
    const passwordInput = document.getElementById('login-password');
    if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', function() {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            toggleBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
            toggleBtn.classList.toggle('active', isPassword);
        });
    }

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('btn-login-submit');
    if (form && submitBtn) {
        form.addEventListener('submit', function() {
            submitBtn.disabled = true;
            submitBtn.querySelector('.btn-text').textContent = 'Signing in...';
        });
    }
});
</script>
{% endblock %}
